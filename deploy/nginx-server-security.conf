# Included inside each OrcAgent server{} block, including Certbot-managed TLS.
server_tokens off;
client_header_timeout 15s;
client_body_timeout 30s;
keepalive_timeout 30s;
limit_conn orca_conn 80;

# Drop methods OrcAgent never needs before they reach Flask/Gunicorn.
if ($request_method ~ ^(TRACE|CONNECT)$) { return 405; }
