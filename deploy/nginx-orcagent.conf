# ── OrcAgent — nginx reverse proxy ──
# Plain HTTP only. Run certbot afterwards (see deploy/README.md); it rewrites
# this file to add the certificate and the HTTPS redirect for you. The small
# security snippet is external so deploys can harden both fresh and existing
# Certbot-managed server blocks without overwriting certificate directives.

server {
    listen 80;
    listen [::]:80;
    server_name orcagent.fun www.orcagent.fun;
    include /etc/nginx/snippets/orcagent-server-security.conf;

    client_max_body_size 12M;

    access_log /var/log/nginx/orcagent.access.log;
    error_log  /var/log/nginx/orcagent.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Published video posts, straight from disk (see deploy/apply-nginx-media.sh).
    location ~ "^/media/videos/([a-f0-9]{32}\.(mp4|jpg))$" {
        alias /var/lib/orcagent-media/videos/$1;
        limit_except GET { deny all; }
        types { video/mp4 mp4; image/jpeg jpg; }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
    }
    location /static/ {
        alias /opt/orcagent/static/;
        etag on;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
        limit_except GET { deny all; }

        open_file_cache max=2000 inactive=60s;
        open_file_cache_valid 120s;
        open_file_cache_min_uses 2;
        open_file_cache_errors on;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Do not append a client-supplied X-Forwarded-For value. OrcAgent uses
        # the forwarded client IP for abuse ceilings and audit hashes, so an
        # attacker must not be able to choose it in their own request headers.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;

        proxy_read_timeout    180s;
        proxy_send_timeout    180s;
        proxy_connect_timeout 15s;

        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8080/health;
        access_log off;
        limit_except GET { deny all; }
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }
}
