name: Security Scan

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev, claude/live-route-kopen-usdc-wimg24]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC

concurrency:
  group: security-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pip-audit bandit playwright pytest
          python -m pip install --quiet -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Python compile check
        run: python -m compileall -q .

      - name: OrcAgent regression checks
        run: |
          fail=0
          for f in tests/test_*.py; do
            echo "── $f ──"
            if python -m pytest --collect-only -q "$f" 2>/dev/null | grep -q '::test_'; then
              if ! python -m pytest -q "$f"; then
                echo "FAILED: $f"
                fail=1
              fi
            elif ! python "$f"; then
              echo "FAILED: $f"
              fail=1
            fi
          done
          exit $fail

      - name: pip-audit
        run: pip-audit --strict -r requirements.txt

      - name: bandit
        run: |
          bandit -r . \
            --exclude ./.git,./node_modules \
            --severity-level high \
            --confidence-level medium \
            -f txt

      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for debug=True in production code
        run: |
          if grep -rn --include="*.py" 'app\.run.*debug\s*=\s*True' . ; then
            echo "ERROR: debug=True found in Python source — must not reach production."
            exit 1
          fi
          echo "OK: no debug=True found."

      - name: Check for CORS origin reflection
        run: |
          if grep -rn --include="*.py" \
            -E "Access-Control-Allow-Origin.*request\.headers|request\.headers.*Access-Control-Allow-Origin" . ; then
            echo "ERROR: Potential CORS origin reflection detected — use an explicit allowlist."
            exit 1
          fi
          echo "OK: no CORS origin reflection found."

      - name: Check tracked secret files
        run: |
          if git ls-files | grep -E '(^|/)(\.env($|\.)|\.secret_key$|id_rsa$|id_ed25519$|.*\.pem$|.*\.key$)' ; then
            echo "ERROR: secret-like file is tracked by git."
            exit 1
          fi
          echo "OK: no secret-like files tracked."
