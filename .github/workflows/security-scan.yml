name: Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC

jobs:
  security:
    name: Security checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout
        # actions/checkout v4 pinned to an immutable commit to prevent a
        # compromised/moved marketplace tag from changing CI code silently.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0   # full history needed for gitleaks
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v5, pinned for the same supply-chain reason.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pip-audit bandit pytest
          python -m pip install --quiet -r requirements.txt
          PUMP_NODE_VERSION="$(cat pump_adapter/.node-version)"
          test "$PUMP_NODE_VERSION" = "22.23.2"
          PUMP_NODE_ARCHIVE="node-v${PUMP_NODE_VERSION}-linux-x64.tar.xz"
          curl --proto '=https' --tlsv1.2 -fsS --retry 3 --max-time 180 \
            "https://nodejs.org/dist/v${PUMP_NODE_VERSION}/${PUMP_NODE_ARCHIVE}" \
            -o "$RUNNER_TEMP/$PUMP_NODE_ARCHIVE"
          echo "d60acfe00a2932254bb0ad20e01b0d74397a0875595de719654b214f4b03f307  $RUNNER_TEMP/$PUMP_NODE_ARCHIVE" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$PUMP_NODE_ARCHIVE" -C "$RUNNER_TEMP" --no-same-owner
          PUMP_NODE="$RUNNER_TEMP/node-v${PUMP_NODE_VERSION}-linux-x64/bin/node"
          echo "ORCAGENT_PUMP_NODE=$PUMP_NODE" >> "$GITHUB_ENV"
          ORCAGENT_PUMP_NODE="$PUMP_NODE" bash pump_adapter/run-node.sh npm \
            --prefix pump_adapter ci --ignore-scripts --no-audit --no-fund

      - name: Python compile check
        run: python -m compileall -q .

      - name: Wallet account regressions
        run: |
          node --check static/new-wallet.js
          python -m pytest -q tests/test_new_wallet_accounts.py tests/test_wallet_onboarding.py tests/test_guest_startup_no_legacy_onboarding.py

      - name: Bot +7% and trading intelligence regressions
        run: |
          python tests/test_bot_entry_7pct_policy.py
          PYTHONPATH=. python tests/test_bot_shadow_learning.py
          PYTHONPATH=. python tests/test_bot_shadow_wiring.py
          PYTHONPATH=. python tests/test_bot_learning.py

      - name: PWA lifecycle cleanup regression
        run: |
          python tests/test_page_lifecycle_cleanup.py
          node tests/test_lazy_route_unmount_cleanup.js

      - name: Creator fee claim reliability
        run: |
          python tests/test_creator_claim_reliability.py
          python tests/test_creator_claim_profile_privacy.py
          python tests/test_creator_rewards_preflight.py
          python tests/test_creator_claims_cleanup.py
          python tests/test_phantom_claim_mobile.py
          python tests/test_creator_fee_share.py
          python tests/test_portfolio_history_redesign.py

      - name: OrcAgent security regression checks
        run: |
          node --check static/dashboard.js
          node --check static/feed-x-embed.js
          node tests/test_feed_x_embed.cjs
          node tests/test_feed_reply_orphans.js
          node tests/test_agent_clean_replies.js
          node tests/test_agent_token_flow.js
          node tests/test_agent_token_identity.js
          node tests/test_mention_anchor.cjs
          node tests/test_nested_reply_mention.cjs
          node tests/test_feed_reply_loading.js
          node --check static/live-market-pro.js
          node --check static/home-feed-chart-redesign.js
          node --check static/feed-calls.js
          node --check static/call-sharing.js
          node --check static/group-chats.js
          node --check static/chat-tips.js
          node --check static/creator-rewards.js
          python -m pytest -q tests/test_security_boundaries.py tests/test_dashboard_output_security.py tests/test_xss_injection_hardening.py tests/test_security_xss_csrf_injection.py
          python tests/test_security_hardening.py
          python tests/test_authorization_hardening.py
          python tests/test_idor_hardening.py
          python tests/test_financial_authorization_hardening.py
          python tests/test_security_phase2.py
          python tests/test_auth_replay_runtime.py
          python tests/test_ssrf_hardening.py
          python tests/test_stay_connected.py
          python tests/test_deploy_security.py
          python tests/test_browser_shared_secret_hardening.py
          python tests/test_admin_csrf_hardening.py
          python tests/test_trading_wallet_generator.py
          python tests/test_solana_only.py
          python tests/test_solana_gasless_trading.py
          python -m pytest -q tests/test_native_sol_payments.py tests/test_group_tips.py tests/test_token_promotions.py tests/test_token_promotions_wsgi.py tests/test_group_chat_message_management.py tests/test_trader_rewards.py tests/test_trader_fee_discounts.py tests/test_pro_trade_runtime.py tests/test_profile_portfolio_balance.py tests/test_watchlist_alerts.py tests/test_verified_calls.py tests/test_following_traders.py tests/test_call_invitations.py tests/test_creator_rewards.py tests/test_creator_rewards_runtime.py
          python tests/test_solana_buy_flow.py
          python tests/test_sell_a_share.py
          python tests/test_portfolio_reliability.py
          PYTHONPATH=. python tests/test_portfolio_snapshot_authority.py
          python tests/test_portfolio_full_breakdown.py
          python tests/test_protection_exit_runtime.py
          PYTHONPATH=. python tests/test_responsive_agent.py
          PYTHONPATH=.:tests python tests/test_platform_prices.py
          PYTHONPATH=.:tests python tests/test_agent_price_reliability.py
          PYTHONPATH=.:tests python tests/test_platform_reasoner.py
          python tests/test_bot_follows_settings.py
          python tests/test_retired_extra_pages.py
          python tests/test_position_guardian.py
          python tests/test_stop_loss_safety.py
          python tests/test_sell_value_stop.py
          python tests/test_exit_watch_every_second.py
          python tests/test_live_trades_truth.py
          python tests/test_live_trades_overview.py
          bash deploy/check-performance-contract.sh
          PYTHONPATH=.:tests python -m unittest tests.test_platform_assistant tests.test_platform_learning

      - name: pip-audit
        run: pip-audit --strict -r requirements.txt

      - name: bandit
        run: |
          bandit -r . \
            --exclude ./.git,./node_modules \
            --severity-level high \
            --confidence-level medium \
            -f txt

      - name: gitleaks
        # gitleaks-action v2 pinned to the commit already verified in CI.
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for debug=True in production code
        run: |
          if grep -rn --include="*.py" 'app\.run.*debug\s*=\s*True' . ; then
            echo "ERROR: debug=True found in Python source — must not reach production."
            exit 1
          fi
          echo "OK: no debug=True found."

      - name: Check for CORS origin reflection
        run: |
          if grep -rn --include="*.py" \
            -E "Access-Control-Allow-Origin.*request\.headers|request\.headers.*Access-Control-Allow-Origin" . ; then
            echo "ERROR: Potential CORS origin reflection detected — use an explicit allowlist."
            exit 1
          fi
          echo "OK: no CORS origin reflection found."

      - name: Check tracked secret files
        run: |
          if git ls-files | grep -Ei '(^|/)(\.env($|\.)|\.secret_key$|id_rsa$|id_ed25519$|backups?/|dumps?/|.*\.(pem|key|p12|pfx|bak|backup|dump|db|sqlite|sqlite3|sql)($|[.-]))' ; then
            echo "ERROR: secret/database/backup-like file is tracked by git."
            exit 1
          fi
          echo "OK: no secret/database/backup-like files tracked."

