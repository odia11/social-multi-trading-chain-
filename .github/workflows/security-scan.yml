name: Security Scan

on:
  push:
    branches: [main, dev]
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC

jobs:
  security:
    name: Security checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout
        # actions/checkout v4 pinned to an immutable commit to prevent a
        # compromised/moved marketplace tag from changing CI code silently.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0   # full history needed for gitleaks
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v5, pinned for the same supply-chain reason.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pip-audit bandit
          python -m pip install --quiet -r requirements.txt

      - name: Python compile check
        run: python -m compileall -q .

      - name: OrcAgent security regression checks
        run: |
          python tests/test_security_hardening.py
          python tests/test_authorization_hardening.py
          python tests/test_idor_hardening.py
          python tests/test_financial_authorization_hardening.py
          python tests/test_security_phase2.py
          python tests/test_auth_replay_runtime.py
          python tests/test_ssrf_hardening.py
          python tests/test_stay_connected.py
          python tests/test_deploy_security.py
          python tests/test_browser_shared_secret_hardening.py

      - name: pip-audit
        run: pip-audit --strict -r requirements.txt

      - name: bandit
        run: |
          bandit -r . \
            --exclude ./.git,./node_modules \
            --severity-level high \
            --confidence-level medium \
            -f txt

      - name: gitleaks
        # gitleaks-action v2 pinned to the commit already verified in CI.
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for debug=True in production code
        run: |
          if grep -rn --include="*.py" 'app\.run.*debug\s*=\s*True' . ; then
            echo "ERROR: debug=True found in Python source — must not reach production."
            exit 1
          fi
          echo "OK: no debug=True found."

      - name: Check for CORS origin reflection
        run: |
          if grep -rn --include="*.py" \
            -E "Access-Control-Allow-Origin.*request\.headers|request\.headers.*Access-Control-Allow-Origin" . ; then
            echo "ERROR: Potential CORS origin reflection detected — use an explicit allowlist."
            exit 1
          fi
          echo "OK: no CORS origin reflection found."

      - name: Check tracked secret files
        run: |
          if git ls-files | grep -E '(^|/)(\.env($|\.)|\.secret_key$|id_rsa$|id_ed25519$|.*\.pem$|.*\.key$)' ; then
            echo "ERROR: secret-like file is tracked by git."
            exit 1
          fi
          echo "OK: no secret-like files tracked."
