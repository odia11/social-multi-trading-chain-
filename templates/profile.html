<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>{{ display_name }} — OrcAgent</title>
<link rel="manifest" href="/app.webmanifest" crossorigin="use-credentials">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OrcAgent">
<link rel="apple-touch-icon" href="/static/icon-180.png?v=6">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"></noscript>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#0a0b0e;color:#eef1f5;font-family:'Geist',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
:root{
  --bg:#0a0b0e;--bg2:#101216;--bg3:#16191f;--bg4:#21252c;
  --accent:#f7b955;--text:#eef1f5;--muted:#565d68;
  --green:#3ad29b;--red:#ff4d6a;
  --border:#16191f;--border2:#21252c;
}

@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* ── APP SHELL (nav is now the shared navbar component, static/navbar.css) ── */
#app{display:flex}
.pf-main{width:100%;max-width:720px;margin:0 auto;background:#0a0b0e;min-width:0}

/* ── COVER ── */
.pf-cover{height:200px;background:linear-gradient(180deg,#101216 0%,#0a0b0e 100%);position:relative;flex-shrink:0}
.pf-cover-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.pf-cover-edit-wrap{position:absolute;top:12px;right:12px;z-index:2}
.pf-cover-edit-btn{width:40px;height:40px;background:#f7b955;backdrop-filter:blur(3px);color:#0a0b0e;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,opacity .15s;opacity:.85}
.pf-cover-edit-btn:hover{background:rgba(10,11,14,.75);opacity:1}
.pf-cover-menu{display:none;position:absolute;top:calc(100% + 8px);right:0;background:#101216;border:1px solid #21252c;border-radius:10px;padding:4px;min-width:150px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.pf-cover-menu.open{display:block}
.pf-cover-menu button{display:block;width:100%;text-align:left;background:none;border:none;color:#eef1f5;font-size:13px;padding:8px 10px;border-radius:7px;cursor:pointer;font-family:inherit}
.pf-cover-menu button:hover{background:#16191f}
.pf-cover-menu button.danger{color:#ff4d6a}
.pf-cover-msg{position:absolute;bottom:8px;right:12px;z-index:2;font-size:11px;color:#8a919c;background:rgba(10,11,14,.7);padding:4px 9px;border-radius:7px}
.pf-cover-msg:empty{display:none}
.pf-cover-msg.ok{color:#3ad29b}
.pf-cover-msg.err{color:#ff4d6a}

/* ── AVATAR (overlaps cover bottom) ── */
.pf-avatar-wrap{position:absolute;bottom:-40px;left:28px;z-index:1}
.pf-avatar-img{width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid #0a0b0e;display:block}
.pf-avatar-fallback{width:80px;height:80px;border-radius:50%;background:#16191f;border:3px solid #0a0b0e;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#f7b955;font-family:'JetBrains Mono',monospace}
.pf-avatar-edit-badge{position:absolute;right:-2px;bottom:-2px;width:26px;height:26px;border-radius:50%;background:#f7b955;border:2px solid #0a0b0e;display:flex;align-items:center;justify-content:center;color:#0a0b0e;cursor:pointer;z-index:2;transition:opacity .15s}
.pf-avatar-edit-badge:hover{opacity:.85}
.pf-avatar-msg{position:absolute;top:-26px;left:0;white-space:nowrap;font-size:11px;color:#8a919c;background:rgba(10,11,14,.7);padding:4px 9px;border-radius:7px;z-index:2}
.pf-avatar-msg:empty{display:none}
.pf-avatar-msg.ok{color:#3ad29b}
.pf-avatar-msg.err{color:#ff4d6a}

/* ── IDENTITY SECTION ── */
.pf-identity{padding:52px 28px 0;max-width:720px}
.pf-name-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.pf-display-name{font-size:22px;font-weight:700;color:#eef1f5;letter-spacing:-.02em;overflow-wrap:break-word;word-break:break-word;max-width:100%}
.pf-verified{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#f7b955;flex-shrink:0}
.pf-verified svg{display:block}
.pf-x-badge{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#000;border:1px solid #21252c;flex-shrink:0;text-decoration:none;transition:opacity .15s}
.pf-x-badge:hover{opacity:.8}
.pf-x-badge svg{display:block}
.pf-team-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px 3px 7px;border-radius:999px;border:1px solid;font-size:11px;font-weight:700;letter-spacing:.02em;flex-shrink:0}
.pf-meta-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.pf-handle-tag{font-size:13px;color:#565d68;font-family:'JetBrains Mono',monospace}
.pf-meta-sep{color:#21252c;font-size:12px}
.pf-joined-tag{font-size:12px;color:#565d68;display:flex;align-items:center;gap:5px}
.pf-bio-text{font-size:14px;color:#8a919c;line-height:1.6;margin-bottom:14px;max-width:480px}
.pf-action-row{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.pf-btn-primary{background:#f7b955;color:#0a0b0e;border:none;border-radius:10px;padding:9px 20px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Geist',system-ui,sans-serif;transition:opacity .15s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.pf-btn-primary:hover{opacity:.85}
.pf-btn-secondary{background:transparent;color:#eef1f5;border:1px solid #21252c;border-radius:10px;padding:9px 20px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Geist',system-ui,sans-serif;transition:border-color .15s,color .15s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.pf-follows-you{display:inline-flex;align-items:center;padding:6px 12px;border-radius:8px;background:#16191f;color:#8a919c;font-size:11px;font-weight:600;align-self:center}
.pf-btn-secondary:hover{border-color:#565d68;color:#eef1f5}
.pf-btn-icon{background:transparent;color:#565d68;border:1px solid #21252c;border-radius:10px;padding:9px 12px;font-size:14px;cursor:pointer;transition:border-color .15s,color .15s;display:inline-flex;align-items:center;justify-content:center}
.pf-btn-icon:hover{border-color:#565d68;color:#eef1f5}


/* ── TIP USDC ── */
.pf-btn-tip{background:transparent;color:#f7b955;border:1px solid #f7b955;border-radius:10px;padding:9px 20px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Geist',system-ui,sans-serif;transition:background .15s,color .15s,box-shadow .15s;display:inline-flex;align-items:center;gap:7px}
.pf-btn-tip:hover{background:rgba(247,185,85,.09);box-shadow:0 0 0 3px rgba(247,185,85,.07)}
.tip-back{display:none;position:fixed;inset:0;z-index:10030;background:rgba(0,0,0,.72);backdrop-filter:blur(7px);align-items:flex-end;justify-content:center;padding:18px}
.tip-back.open{display:flex}
.tip-sheet{width:min(560px,100%);background:#0d1116;border:1px solid #252b33;border-radius:24px;padding:20px;box-shadow:0 -18px 70px rgba(0,0,0,.55);max-height:min(760px,92vh);overflow-y:auto}
.tip-handle{width:42px;height:4px;border-radius:999px;background:#343b45;margin:0 auto 14px}
.tip-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.tip-title{font-size:22px;font-weight:700;letter-spacing:-.02em}.tip-close{border:0;background:none;color:#8a919c;font-size:30px;line-height:1;cursor:pointer;padding:2px 6px}
.tip-user{display:flex;align-items:center;gap:12px;border:1px solid #20262e;background:#10151b;border-radius:16px;padding:13px;margin-bottom:18px}
.tip-user img,.tip-user-fallback{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid rgba(247,185,85,.35)}
.tip-user-fallback{display:flex;align-items:center;justify-content:center;background:#16191f;color:#f7b955;font-weight:800}
.tip-user-main{min-width:0;flex:1}.tip-user-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tip-user-handle{font:12px 'JetBrains Mono',monospace;color:#68717d;margin-top:2px}
.tip-label{display:block;font-size:12px;font-weight:600;color:#c8ced6;margin:14px 0 7px}.tip-input-wrap{display:flex;align-items:center;border:1px solid #2a313a;background:#10151b;border-radius:13px;padding:0 14px}.tip-input{min-width:0;flex:1;background:none;border:0;outline:none;color:#eef1f5;font-size:28px;font-weight:600;padding:13px 0;font-family:'JetBrains Mono',monospace}.tip-input-sym{font-size:14px;color:#a0a8b3;font-weight:600}
.tip-presets{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}.tip-preset{border:1px solid #252b33;background:#10151b;color:#eef1f5;border-radius:11px;padding:10px 4px;font-size:12px;font-weight:650;cursor:pointer}.tip-preset:hover,.tip-preset.active{background:#f7b955;color:#0a0b0e;border-color:#f7b955}
.tip-network{display:flex;align-items:center;gap:10px;border:1px solid #252b33;background:#10151b;border-radius:13px;padding:12px 14px;color:#eef1f5}.tip-sol{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#0b0d12;color:#9b7cff;font-weight:900;font-size:11px}.tip-network small{display:block;color:#68717d;margin-top:1px}
.tip-message{width:100%;resize:none;background:#10151b;color:#eef1f5;border:1px solid #252b33;border-radius:13px;padding:12px 14px;font-family:inherit;outline:none;min-height:72px}.tip-message:focus,.tip-input-wrap:focus-within{border-color:rgba(247,185,85,.65)}
.tip-summary{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#10151b;border:1px solid #252b33;border-radius:14px;padding:14px;margin-top:14px}.tip-summary-left{color:#8a919c;font-size:13px}.tip-summary-val{text-align:right;font-weight:750}.tip-summary-usd{display:block;color:#68717d;font-size:11px;font-weight:500}
.tip-submit{width:100%;border:0;border-radius:13px;background:#f7b955;color:#0a0b0e;font-size:15px;font-weight:800;padding:14px 16px;margin-top:12px;cursor:pointer}.tip-submit:disabled{opacity:.5;cursor:not-allowed}.tip-note{text-align:center;color:#68717d;font-size:11px;margin-top:10px}.tip-msg{min-height:20px;margin-top:10px;text-align:center;font-size:12px}.tip-msg.err{color:#ff4d6a}.tip-msg.ok{color:#3ad29b}
@media(max-width:600px){.tip-back{padding:0;align-items:flex-end}.tip-sheet{border-radius:24px 24px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px))}.tip-presets{gap:6px}.tip-preset{padding:10px 2px}.pf-action-row .pf-btn-tip{flex:1;justify-content:center;min-width:145px}}

/* ── STATS ROW (Following / Followers / Copiers) ── */
.pf-follow-row{display:flex;align-items:center;gap:20px;padding:0 28px 20px;flex-wrap:wrap}
.pf-follow-item{display:flex;align-items:center;gap:5px;cursor:pointer}
.pf-follow-item:hover .pf-follow-label{color:#eef1f5}
.pf-follow-count{font-size:14px;font-weight:700;color:#eef1f5;font-family:'JetBrains Mono',monospace}
.pf-follow-label{font-size:13px;color:#565d68;transition:color .15s}
.pf-follow-sep{color:#21252c}

/* ── CONTENT AREA ── */
.pf-content{padding:0 28px 60px;max-width:720px}

/* ── WALLET ROW ── */
.pf-wallet-row{display:flex;align-items:center;gap:10px;background:#101216;border:1px solid #16191f;border-radius:12px;padding:10px 14px;margin-bottom:20px}
.pf-wallet-addr{font-family:'JetBrains Mono',monospace;font-size:12px;color:#565d68;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-copy-btn{background:none;border:none;color:#565d68;cursor:pointer;font-size:16px;padding:0;transition:color .15s;flex-shrink:0;line-height:1;display:inline-flex;align-items:center}
.pf-copy-btn:hover{color:#f7b955}

/* ── STAT TILES (4 tiles) ── */
.pf-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.pf-tile{background:#101216;border:1px solid #16191f;border-radius:16px;padding:16px 14px;display:flex;flex-direction:column;gap:6px}
.pf-tile-lbl{font-size:10px;color:#565d68;text-transform:uppercase;letter-spacing:.12em;font-weight:600}
.pf-tile-val{font-size:20px;font-weight:700;font-family:'JetBrains Mono',monospace;color:#eef1f5;line-height:1.1}
.pf-tile-val.pos{color:#3ad29b}
.pf-tile-val.neg{color:#ff4d6a}
.pf-tile-val.acc{color:#f7b955}
.pf-tile-sub{font-size:11px;color:#565d68}

/* ── ACHIEVEMENTS ── */
.pf-section-hdr{font-size:12px;font-weight:700;color:#565d68;text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px}
.pf-achievements{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:20px;scrollbar-width:none}
.pf-achievements::-webkit-scrollbar{display:none}
.pf-badge{display:inline-flex;align-items:center;gap:7px;background:#101216;border:1px solid #16191f;border-radius:999px;padding:7px 14px;white-space:nowrap;flex-shrink:0}
.pf-badge-icon{display:inline-flex;color:#8a919c;line-height:1}
.pf-badge-label{font-size:12px;font-weight:600;color:#eef1f5}
.pf-badge-sub{font-size:10px;color:#565d68;margin-left:2px}
.pf-badge.gold{border-color:rgba(247,185,85,.35);background:rgba(247,185,85,.07)}
.pf-badge.gold .pf-badge-label{color:#f7b955}
.pf-badge.gold .pf-badge-icon{color:#f7b955}
.pf-badge.green{border-color:rgba(58,210,155,.3);background:rgba(58,210,155,.06)}
.pf-badge.green .pf-badge-label{color:#3ad29b}
.pf-badge.green .pf-badge-icon{color:#3ad29b}

/* ── RECENT TRADES ── */
.pf-trades{display:flex;flex-direction:column;gap:2px;margin-bottom:20px}
.pf-trade-row{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#101216;border-radius:12px;border:1px solid #16191f;transition:background .12s}
.pf-trade-row:hover{background:#12151a}
.pf-trade-chip{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;background:#16191f;font-size:11px;font-weight:700;color:#eef1f5;flex-shrink:0;font-family:'JetBrains Mono',monospace;overflow:hidden}
.pf-trade-chip img{width:32px;height:32px;border-radius:8px;object-fit:cover}
.pf-trade-name{font-size:13px;font-weight:600;color:#eef1f5;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-trade-dir{font-size:11px;font-weight:700;border-radius:6px;padding:3px 8px;flex-shrink:0}
.pf-trade-dir.buy{background:rgba(58,210,155,.12);color:#3ad29b}
.pf-trade-dir.sell{background:rgba(255,77,106,.1);color:#ff4d6a}
.pf-trade-pnl{font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace;flex-shrink:0;min-width:60px;text-align:right}
.pf-trade-pnl.pos{color:#3ad29b}
.pf-trade-pnl.neg{color:#ff4d6a}
.pf-trade-time{font-size:11px;color:#565d68;flex-shrink:0}
.pf-calls{display:flex;flex-direction:column;gap:2px;margin-bottom:20px}
.pf-call-row{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#101216;border-radius:12px;border:1px solid #16191f;transition:background .12s}
.pf-call-row:hover{background:#12151a}
.pf-call-chip{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;background:#16191f;font-size:11px;font-weight:700;color:#eef1f5;flex-shrink:0;font-family:'JetBrains Mono',monospace;overflow:hidden}
.pf-call-chip img{width:32px;height:32px;border-radius:8px;object-fit:cover}
.pf-call-name{font-size:13px;font-weight:600;color:#eef1f5;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-call-multi{font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace;flex-shrink:0;min-width:52px;text-align:right}
.pf-call-multi.pos{color:#3ad29b}
.pf-call-multi.neg{color:#ff4d6a}
.pf-call-prices{font-size:11px;color:#565d68;font-family:'JetBrains Mono',monospace;flex-shrink:0}

/* ── POSTS ── */
.pf-posts{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.pf-post{background:#101216;border:1px solid #16191f;border-radius:14px;padding:16px}
.pf-post-content{font-size:14px;color:#eef1f5;line-height:1.55;word-break:break-word;white-space:pre-wrap}
.pf-post-meta{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.pf-post-time{font-size:11px;color:#565d68;font-family:'JetBrains Mono',monospace}
.pf-post-likes{font-size:11px;color:#565d68;display:flex;align-items:center;gap:4px}
.pf-empty{font-size:13px;color:#565d68;text-align:center;padding:32px 0;background:#101216;border:1px solid #16191f;border-radius:14px}

/* scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#21252c;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#2d333c}
*{scrollbar-width:thin;scrollbar-color:#21252c transparent}

/* ── TABLET (768–1024px) ── */
@media(max-width:1024px) and (min-width:768px){
  .pf-tiles{grid-template-columns:repeat(2,1fr)}
}

/* ── MOBILE (<768px) ── */
@media(max-width:767px){
  #app{display:block}
  .pf-main{max-width:none;margin:0}

  /* cover: shorter, avatar centered */
  .pf-cover{height:140px}
  .pf-avatar-wrap{left:50%;transform:translateX(-50%)}
  .pf-cover-edit-wrap{top:8px;right:8px}
  .pf-cover-edit-btn{width:32px;height:32px}

  /* identity */
  .pf-identity{padding:52px 16px 0;text-align:center}
  .pf-name-row{justify-content:center}
  .pf-meta-row{justify-content:center}
  .pf-bio-text{max-width:100%}
  .pf-action-row{justify-content:center}

  /* stats + content */
  .pf-follow-row{justify-content:center;padding:0 16px 20px}
  .pf-content{padding:0 16px 60px}
  .pf-tiles{grid-template-columns:repeat(2,1fr)}
  .pf-wallet-addr{font-size:11px}
  /* 44px tap targets */
  .pf-btn-primary,.pf-btn-secondary{min-height:44px}
  .pf-btn-icon{min-height:44px;min-width:44px}
  .pf-copy-btn{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center}
  html,body{overflow-x:clip}  /* clip, not hidden: hidden makes the root a scroll container, which breaks the sticky navbar */
}
/* ── SHARE MODAL ── */
.spm-back{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:600;align-items:flex-start;justify-content:center;padding:60px 16px 20px}
.spm-back.open{display:flex}
.spm-box{background:#101216;border:1px solid #21252c;border-radius:16px;width:100%;max-width:400px;overflow:hidden;flex-shrink:0}
.spm-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 14px;border-bottom:1px solid #16191f}
.spm-title{font-size:15px;font-weight:700;color:#eef1f5}
.spm-body{padding:18px}
.spm-row{display:flex;gap:8px;margin-bottom:14px}
.spm-input{flex:1;background:#0a0c0f;border:1px solid #21252c;border-radius:8px;padding:9px 12px;color:#eef1f5;font-size:13px;outline:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spm-copy-btn{background:#21252c;border:none;border-radius:8px;padding:9px 14px;color:#eef1f5;font-size:13px;cursor:pointer;white-space:nowrap;transition:background .15s}
.spm-copy-btn:hover{background:#2a2f38}
.spm-x-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:#000;border:1px solid #333;border-radius:10px;padding:11px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s}
