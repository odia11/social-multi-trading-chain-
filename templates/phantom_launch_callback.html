<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer"><title>OrcAgent · Token Launch</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<meta property="og:title" content="OrcAgent · Token Launch"><meta property="og:site_name" content="OrcAgent">
<meta property="og:url" content="https://orcagent.fun/phantom-launch-callback">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0d1014;color:#f4f5f8;
font:16px system-ui,sans-serif;display:grid;place-items:center;padding:22px}
main{max-width:450px;width:100%;padding:28px 22px;border:1px solid #625039;border-radius:18px;background:#151a20}
h1{font-size:24px;margin:0 0 20px}p{line-height:1.55;color:#bcc4cf}
a,button{display:inline-block;border:0;background:#f4ba57;color:#181818;text-decoration:none;
font:700 15px system-ui,sans-serif;border-radius:12px;padding:15px;margin:8px 0}
small{color:#9ca6b4;display:block;overflow-wrap:anywhere}
</style></head><body><main>
<h1>OrcAgent · Token Launch</h1>
<p id="status" role="status" aria-live="polite">Waiting for Phantom approval…</p>
<a id="continue" href="/token-launch" style="display:none">Return to Token Launch</a>
<small id="help"></small>
</main><script>
(function(){
 var p=new URLSearchParams(location.search);
 var status=document.getElementById('status'),btn=document.getElementById('continue');
 var help=document.getElementById('help');
 var pwa=p.get('pwa')==='1',claim=p.get('action')==='claim';
 if(claim)document.querySelector('h1').textContent='OrcAgent · Creator fees';
 // Remove all encrypted return payloads from browser history immediately.
 history.replaceState(null,'','/phantom-launch-callback');
 function done(message){status.textContent=message;btn.style.display=pwa?'none':'inline-block';
   help.textContent=pwa
     ?(claim?'Return to your installed OrcAgent app and check Claim history before another approval.':'Your installed OrcAgent app is still open. Swipe up to open the iPhone app switcher and select OrcAgent. Your saved launch will refresh there. Do not create another token while its transaction is pending.')
     :(claim?'Return to the original OrcAgent tab and check Claim history.':'Return to your original OrcAgent tab. Your saved launch remains there.');}
 if(p.get('errorCode')){
   done(p.get('errorCode')==='4001'
     ? 'Phantom approval was cancelled. Your saved token is unchanged.'
     : 'Phantom could not complete this approval. Return to your saved token and try again.');return;
 }
 if(!p.get('token')||!p.get('step')||!p.get('nonce')||!p.get('data')){
   done('Incomplete Phantom response. Return to the original saved launch.');return;
 }
 fetch('/api/phantom-launch/complete',{method:'POST',credentials:'include',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({token:p.get('token'),step:p.get('step'),
     nonce:p.get('nonce'),data:p.get('data'),
     phantom_encryption_public_key:p.get('phantom_encryption_public_key')})})
 .then(function(r){return r.json()})
 .then(function(r){
   if(!r||!r.ok){done(r&&r.msg||'Could not verify Phantom response. Check the saved launch.');return;}
   if(r.url&&r.step==='sign'){
     status.textContent=claim?'Connected. Continue in Phantom to approve the creator-fee claim.':'Connected. Tap Continue in Phantom to approve your token launch.';
     btn.href=r.url;btn.textContent='Continue in Phantom';btn.style.display='inline-block';
     return;
   }
   done(r.msg||(claim?'Claim submitted. Check Claim history.':'Phantom transaction submitted. Check your token status.'));
   var txsig=r.signature||r.create_signature;
   if(txsig)help.textContent='Transaction: '+txsig+
     (pwa?'. Switch back to the installed OrcAgent app; its saved launch refreshes automatically.':'. Returning to OrcAgent…');
   if(!claim&&!pwa){
     var target=(r.live&&r.mint)?('/token/'+encodeURIComponent(r.mint)):'/token-launch';
     status.textContent=r.live?'Launch complete. Opening your token on OrcAgent…':'Launch submitted. Returning to OrcAgent…';
     setTimeout(function(){location.replace(target)},450);
   }
 })
 .catch(function(){done('Could not reach OrcAgent. Check your saved token before retrying.');});
})();
</script></body></html>
